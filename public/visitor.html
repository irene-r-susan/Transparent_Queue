<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment - Transparent Queue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Book Appointment</h1>
      <p>Select a department and reason for visit</p>
    </div>
    
    <form id="bookingForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="Jane Doe">
      </div>
      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" required placeholder="30">
      </div>
      <div class="form-group">
        <label for="department_id">Department</label>
        <select id="department_id" required>
          <option value="">Loading departments...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="reason">Reason for visit</label>
        <input type="text" id="reason" required placeholder="Renew passport">
      </div>
      <div class="form-group">
        <label for="service_type">Service Type</label>
        <select id="service_type" required>
          <option value="quick approval">Quick Approval (~5 mins)</option>
          <option value="longer consultation">Longer Consultation (~20 mins)</option>
        </select>
      </div>
      <button type="submit" class="btn" id="submitBtn">Book Appointment</button>
    </form>
  </div>
  <script src="/visitor.js"></script>
</body>
</html>
